[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labdev-runtime"
version = "0.1.0"
description = "A Python package for interacting with Git repositories."
authors = [
    { name="Your Name", email="your.email@example.com" }
]
dependencies = [
    "gitpython"
]

[project.scripts]
labdev = "labdev.cli:main"

[tool.pytest.ini_options]
addopts = "--capture=no"
